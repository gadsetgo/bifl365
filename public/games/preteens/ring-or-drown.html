<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ring or Drown in Lava — by Manya</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif}
#gc{display:block;border-radius:12px 12px 0 0;cursor:crosshair;touch-action:none;max-width:100%}
#ui{color:#fff;padding:7px 12px;background:#0d0620;border-radius:0 0 12px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:480px;max-width:100%}
#ui span{font-size:12px;opacity:.85}#ui b{font-size:13px}
.badge{background:#5533aa;color:#fff;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
#shopBtn{margin-left:auto;background:#5533aa;border:none;color:#fff;padding:4px 12px;border-radius:7px;cursor:pointer;font-size:12px}
#shopPanel{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(8,4,26,.97);border-radius:12px;overflow-y:auto;padding:14px;color:#fff;z-index:10}
#shopPanel h2{margin:0 0 10px;font-size:16px}
.sr{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:7px;margin-bottom:12px}
.si{background:#1e0b50;border:1.5px solid #5533aa;border-radius:8px;padding:8px 5px;text-align:center;cursor:pointer}
.si.owned{border-color:#33cc77;background:#083828}.si.active{border-color:#ffcc00;background:#3a2600}
.si:hover:not(.owned):not(.active){border-color:#9977ff}
.sn{font-size:11px;font-weight:700;margin-bottom:2px}.sc{font-size:10px;color:#ffcc88}.sp{height:34px;display:flex;align-items:center;justify-content:center;margin:3px 0}
#cSh{background:#991c3c;border:none;color:#fff;padding:5px 14px;border-radius:7px;cursor:pointer;margin-top:6px}
#wrap{position:relative;width:480px;max-width:100%}
</style>
</head>
<body>
<div id="wrap">
<canvas id="gc" width="480" height="520"></canvas>
<div id="ui">
  <span class="badge" id="lvB">LV 1</span>
  <span id="shotSpan">Shots: <b id="shotD">50</b></span>
  <span id="tgtSpan">Target: <b id="tgtD">0/100</b></span>
  <span>Score: <b id="sD">0</b></span>
  <span>Coins: <b id="cD">0</b></span>
  <span id="cmD" style="font-size:13px;font-weight:700"></span>
  <button id="shopBtn" onclick="toggleShop()">Shop</button>
</div>
<div id="shopPanel">
  <h2>Shop</h2>
  <div style="font-size:12px;color:#ffcc88;margin-bottom:8px">Coins: <b id="shopC">0</b></div>
  <div style="font-size:12px;font-weight:600;margin-bottom:5px;color:#aaf">Backdrops</div>
  <div class="sr" id="bdRow"></div>
  <div style="font-size:12px;font-weight:600;margin-bottom:5px;color:#aaf">Ammo</div>
  <div class="sr" id="tRow"></div>
  <div style="font-size:12px;font-weight:600;margin-bottom:5px;color:#aaf">Boosters</div>
  <div class="sr" id="bRow"></div>
  <button id="cSh" onclick="toggleShop()">Close</button>
</div>
</div>
<script>
const cv=document.getElementById('gc'),ct=cv.getContext('2d');
const W=480,H=520,GRAV=.065,SPD=7.8,LX=80;
const LV_SHOTS=[50,40,30],LV_TARGET=100;
const LVS=[
  {n:3,spd:[.006,.009],hit:.74,pts:[5,3,1],miss:3,rise:.016,name:'Level 1 — Easy'},
  {n:4,spd:[.011,.015],hit:.61,pts:[9,5,2],miss:2,rise:.030,name:'Level 2 — Medium'},
  {n:5,spd:[.016,.022],hit:.50,pts:[15,8,3],miss:2,rise:.046,name:'Level 3 — Hard'},
];
let st='title',frame=0,score=0,coins=0,misses=0,combo=0,maxCombo=0;
let lava=0,lavaMode=false,shake=0;
let ball=null,ang=-.78,mx=240,my=260;
let bells=[],floats=[],parts=[],booms=[];
let lv=1,shotsLeft=LV_SHOTS[0],levelScore=0,celebF=0,won=false;
let activeBd='sky',activeTool='ball';
let owned={bd:['sky'],tool:['ball'],boost:[]},mul=1;
let gameMode='normal';
let touchStartX=0,touchStartY=0,touchDragged=false,touchOnBtn=false;

// Title screen button hit rects
const BTN_NORMAL={x:15,y:88,w:215,h:94};
const BTN_TARGET={x:250,y:88,w:215,h:94};

let actx;
function iAud(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}}
function bellTone(freq,dur,vol){
  dur=dur||.9;vol=vol||.28;
  try{iAud();if(!actx)return;
    const o=actx.createOscillator(),g=actx.createGain(),o2=actx.createOscillator(),g2=actx.createGain();
    o.type='sine';o.frequency.value=freq;o2.type='triangle';o2.frequency.value=freq*2.01;
    g.gain.setValueAtTime(vol,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
    g2.gain.setValueAtTime(vol*.2,actx.currentTime);g2.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur*.4);
    o.connect(g);g.connect(actx.destination);o2.connect(g2);g2.connect(actx.destination);
    o.start();o.stop(actx.currentTime+dur);o2.start();o2.stop(actx.currentTime+dur*.4);
  }catch(e){}}
function boomSound(){
  try{iAud();if(!actx)return;
    const len=Math.floor(actx.sampleRate*.42),buf=actx.createBuffer(1,len,actx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.3)*.88;
    const src=actx.createBufferSource(),g=actx.createGain(),f=actx.createBiquadFilter();
    f.type='lowpass';f.frequency.value=300;src.buffer=buf;g.gain.value=.72;
    src.connect(f);f.connect(g);g.connect(actx.destination);src.start();
  }catch(e){}}
function celebSound(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>bellTone(f,.85,.26),i*90));}
function hitSound(){bellTone([523,659,784,880,1047][Math.min(combo,4)],.6,.2);}

function lc(){return LVS[Math.min(lv-1,2)];}
function getLY(){return H-lava-62;}
function getTY(){return getLY()-20;}
function muzzle(){return{x:LX+Math.cos(ang)*56,y:getTY()+Math.sin(ang)*56};}

function initBells(){
  bells=[];const c=lc();
  for(let i=0;i<c.n;i++){
    const bx=115+(W-220)*i/(c.n>1?c.n-1:1)+(Math.random()-.5)*12;
    bells.push({x:bx,bx:bx,y:66+Math.random()*52,w:40,h:70,
      ang:0,spd:c.spd[0]+Math.random()*(c.spd[1]-c.spd[0]),ph:Math.random()*Math.PI*2,
      pts:c.pts,hit:0,hitTimer:0,ringing:false});
  }
}
function sparks(x,y,col){
  for(let i=0;i<11;i++){const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*3;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:28,col:col||'#FFD700'});}
}
function burst(x,y){
  for(let i=0;i<28;i++){const a=Math.random()*Math.PI*2,sp=2+Math.random()*7,r=3+Math.random()*5;
    booms.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:42+Math.random()*14,ml:56,
      col:['#FF8800','#FFCC00','#FF4400','#fff','#FF6600'][i%5],r});}
}
function updAng(){
  ang=Math.atan2(my-getTY(),mx-LX);
  if(ang>-.03)ang=-.03;if(ang<-Math.PI*.95)ang=-Math.PI*.95;
}
function shoot(){
  if(ball||st!=='aiming')return;
  const m=muzzle();
  ball={x:m.x,y:m.y,vx:Math.cos(ang)*SPD,vy:Math.sin(ang)*SPD};
  if(gameMode==='target')shotsLeft--;
  st='flying';shake=5;burst(m.x,m.y);boomSound();
}
function onMiss(){
  misses++;combo=0;
  const c=lc();
  const missThreshold=gameMode==='normal'?7:c.miss;
  if(!lavaMode&&misses>=missThreshold){
    lavaMode=true;lava=Math.max(lava,52);shake=20;
    floats.push({x:W/2,y:H*.44,text:'LAVA MODE!',life:80,col:'#ff4400',big:true});
  } else if(lavaMode)lava=Math.min(H-70,lava+(gameMode==='normal'?20:38));
}
function startCeleb(){
  st='roundclear';celebF=0;
  for(let b of bells)b.ringing=true;
}
function updHUD(){
  document.getElementById('sD').textContent=score;
  document.getElementById('cD').textContent=coins;
  document.getElementById('lvB').textContent=gameMode==='normal'?'FREE':'LV '+lv;
  document.getElementById('shotD').textContent=Math.max(0,shotsLeft);
  document.getElementById('tgtD').textContent=Math.min(levelScore,LV_TARGET)+'/'+LV_TARGET;
  document.getElementById('shotSpan').style.display=gameMode==='target'?'':'none';
  document.getElementById('tgtSpan').style.display=gameMode==='target'?'':'none';
  const cd=document.getElementById('cmD');
  cd.innerHTML=combo>1?`<b style="color:${['#ffcc00','#ff8800','#ff44ff'][Math.min(combo-2,2)]}">x${combo}</b>`:'';
}

function update(){
  frame++;
  if(st==='roundclear'){
    celebF++;
    if(celebF===5){boomSound();const m=muzzle();burst(m.x,m.y);shake=12;}
    if(celebF===22){boomSound();const m=muzzle();burst(m.x+18,m.y-12);shake=10;}
    if(celebF===8)celebSound();
    for(let b of bells){b.ang=Math.sin(celebF*.22)*.44;b.x=b.bx+Math.sin(celebF*.22)*30;}
    if(celebF>210){
      if(lv>=3){won=true;st='gameover';}
      else{lv++;levelScore=0;shotsLeft=LV_SHOTS[lv-1];celebF=0;st='levelstart';}
    }
    booms=booms.filter(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.12;b.life--;return b.life>0;});
    parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life--;return p.life>0;});
    floats=floats.filter(f=>{f.y-=.5;f.life--;return f.life>0;});
    updHUD();return;
  }
  if(st==='levelstart'){
    celebF++;
    if(celebF>155){lava=0;lavaMode=false;misses=0;ball=null;shake=0;st='aiming';initBells();}
    return;
  }
  if(st==='title'||st==='gameover')return;
  for(let b of bells){
    b.ang=Math.sin(frame*b.spd+b.ph)*.26;
    b.x=b.bx+Math.sin(frame*b.spd+b.ph)*24;
    if(b.hitTimer>0)b.hitTimer--;
  }
  if(ball){
    ball.vy+=GRAV;ball.x+=ball.vx;ball.y+=ball.vy;
    const c=lc();
    for(let b of bells){
      const dx=ball.x-b.x,dy=ball.y-b.y;
      if(Math.abs(dx)<b.w*c.hit+7&&dy>-8&&dy<b.h+8){
        const zone=dy<b.h*.33?0:dy<b.h*.66?1:2;
        const earned=Math.round(b.pts[zone]*mul);
        score+=earned;coins+=earned;levelScore+=earned;combo++;maxCombo=Math.max(maxCombo,combo);
        b.hit=earned;b.hitTimer=34;
        if(lavaMode)lava=Math.max(12,lava-24);
        hitSound();
        floats.push({x:ball.x,y:ball.y-16,text:'+'+earned,life:55,col:['#FF5555','#FFBB00','#55EE55'][zone]});
        if(combo>1)floats.push({x:W/2,y:H*.35,text:'x'+combo+'!',life:44,col:'#FFD700',big:true});
        sparks(ball.x,ball.y);ball=null;
        if(gameMode==='target'){
          if(levelScore>=LV_TARGET){startCeleb();}
          else if(shotsLeft<=0){st='gameover';}
          else{st='aiming';if(bells.every(bb=>bb.hitTimer===0))initBells();}
        } else {
          st='aiming';
        }
        break;
      }
    }
    if(ball&&ball.y>=H-lava-5){
      if(gameMode==='target'&&lavaMode){st='gameover';}
      else{onMiss();ball=null;if(gameMode==='target'&&shotsLeft<=0&&levelScore<LV_TARGET)st='gameover';else st='aiming';}
    }
    if(ball&&(ball.x>W+20||ball.x<-20||ball.y<-40)){onMiss();ball=null;if(gameMode==='target'&&shotsLeft<=0&&levelScore<LV_TARGET)st='gameover';else st='aiming';}
  }
  const c=lc();
  if(lavaMode&&st!=='gameover')lava=Math.min(H-68,lava+c.rise);
  if(lavaMode&&lava>=H-68)st='gameover';
  if(shake>0)shake--;
  floats=floats.filter(f=>{f.y-=.55;f.life--;return f.life>0;});
  parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life--;return p.life>0;});
  booms=booms.filter(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.12;b.life--;return b.life>0;});
  updHUD();
}

function drawBell(b){
  const bw=b.w,bh=b.h;ct.save();ct.translate(b.x,b.y);
  let ba=b.ang;if(b.ringing)ba+=Math.sin(celebF*.22)*.4;
  ct.rotate(ba);
  ct.fillStyle='#7A5400';ct.beginPath();ct.arc(0,-bh*.08,bw*.14,0,Math.PI*2);ct.fill();
  ct.fillRect(-bw*.07,-bh*.08,bw*.14,bh*.24);
  const g=ct.createLinearGradient(-bw*.55,0,bw*.55,0);
  g.addColorStop(0,'#B8860B');g.addColorStop(.16,'#FFE040');g.addColorStop(.5,'#FFD700');g.addColorStop(.84,'#FFE040');g.addColorStop(1,'#B8860B');
  ct.fillStyle=g;
  ct.beginPath();
  ct.arc(0,bh*.18,bw*.4,Math.PI,0,true);
  ct.bezierCurveTo(bw*.54,bh*.36,bw*.62,bh*.62,bw*.58,bh*.86);
  ct.lineTo(bw*.46,bh);ct.lineTo(-bw*.46,bh);ct.lineTo(-bw*.58,bh*.86);
  ct.bezierCurveTo(-bw*.62,bh*.62,-bw*.54,bh*.36,-bw*.4,bh*.18);
  ct.closePath();ct.fill();
  ct.strokeStyle='#8B6000';ct.lineWidth=1.5;ct.stroke();
  ct.fillStyle='#C09000';ct.fillRect(-bw*.58,bh*.84,bw*1.16,bh*.13);
  ct.strokeStyle='#7A5400';ct.lineWidth=1;ct.strokeRect(-bw*.58,bh*.84,bw*1.16,bh*.13);
  ct.fillStyle='rgba(255,255,255,.22)';ct.beginPath();ct.ellipse(-bw*.12,bh*.28,bw*.09,bh*.06,-.4,0,Math.PI*2);ct.fill();
  ct.strokeStyle='rgba(90,50,0,.3)';ct.lineWidth=1;ct.setLineDash([3,3]);
  [bh*.33,bh*.66].forEach(zy=>{ct.beginPath();ct.moveTo(-bw*.44,zy);ct.lineTo(bw*.44,zy);ct.stroke();});
  ct.setLineDash([]);
  const zy=[bh*.19,bh*.50,bh*.78];
  const zc=['#FF4444','#FFBB00','#44EE44'];
  const zsh=['#600','#540','#040'];
  ct.font=`bold ${Math.round(bw*.3)}px sans-serif`;ct.textAlign='center';
  for(let z=0;z<3;z++){ct.fillStyle=zsh[z];ct.fillText(b.pts[z],1,zy[z]+1);ct.fillStyle=zc[z];ct.fillText(b.pts[z],0,zy[z]);}
  ct.fillStyle='#5C3800';ct.fillRect(-bw*.065,bh*.38,bw*.13,bh*.28);
  ct.beginPath();ct.arc(0,bh*.66,bw*.12,0,Math.PI*2);ct.fill();
  if(b.hitTimer>0){ct.globalAlpha=b.hitTimer/34;ct.fillStyle='#FFFF66';ct.font='bold 17px sans-serif';ct.fillText('+'+b.hit,0,-22);ct.globalAlpha=1;}
  ct.restore();
}

function drawTank(){
  const ly=getLY(),sw=shake?Math.sin(frame*.5)*shake*.7:0;
  ct.save();ct.translate(LX+sw,ly);
  ct.fillStyle='#100E06';ct.fillRect(-34,2,68,13);
  ct.fillStyle='#2C2206';
  [-22,-8,8,22].forEach(wx=>{
    ct.beginPath();ct.arc(wx,8,6.5,0,Math.PI*2);ct.fill();
    ct.strokeStyle='#5a4212';ct.lineWidth=2;ct.stroke();
    ct.strokeStyle='#888';ct.lineWidth=.8;ct.stroke();
  });
  for(let i=0;i<6;i++){ct.strokeStyle='#3a2a0a';ct.lineWidth=1;ct.beginPath();ct.moveTo(-30+i*11,2);ct.lineTo(-30+i*11,15);ct.stroke();}
  ct.fillStyle='#4E6A22';ct.beginPath();ct.moveTo(-28,2);ct.lineTo(-34,-11);ct.lineTo(34,-11);ct.lineTo(28,2);ct.closePath();ct.fill();
  ct.strokeStyle='#2C4412';ct.lineWidth=1;ct.stroke();
  ct.strokeStyle='#3a5018';ct.lineWidth=.8;
  [-18,0,18].forEach(xi=>{ct.beginPath();ct.moveTo(xi,-11);ct.lineTo(xi*(16/18),2);ct.stroke();});
  ct.fillStyle='#3A4E18';ct.fillRect(-9,-10,18,4);ct.strokeStyle='#2a3c10';ct.lineWidth=.7;ct.strokeRect(-9,-10,18,4);
  ct.fillStyle='#5A7228';ct.beginPath();ct.ellipse(0,-18,21,13,0,0,Math.PI*2);ct.fill();
  ct.strokeStyle='#2C4412';ct.lineWidth=1.2;ct.stroke();
  ct.fillStyle='#3A5018';ct.beginPath();ct.ellipse(-4,-20,7,5,-.3,0,Math.PI*2);ct.fill();
  ct.strokeStyle='#243810';ct.lineWidth=.7;ct.stroke();
  ct.save();ct.rotate(ang);
  const bg=ct.createLinearGradient(0,-5.5,0,5.5);
  bg.addColorStop(0,'#566A2A');bg.addColorStop(.4,'#7A8E48');bg.addColorStop(1,'#384618');
  ct.fillStyle=bg;ct.fillRect(2,-5.5,46,11);
  ct.strokeStyle='#243810';ct.lineWidth=.8;
  [10,22,36].forEach(rx=>{ct.beginPath();ct.moveTo(rx,-5.5);ct.lineTo(rx,5.5);ct.stroke();});
  ct.fillStyle='#2E3C14';ct.fillRect(44,-6.5,11,13);
  ct.strokeStyle='#182208';ct.lineWidth=1;ct.strokeRect(44,-6.5,11,13);
  ct.fillStyle='#141E06';
  [-2.5,2.5].forEach(hy=>{ct.beginPath();ct.arc(49,hy,2,0,Math.PI*2);ct.fill();});
  ct.restore();ct.restore();
}

function drawAimLine(){
  if(st!=='aiming')return;
  const ty=getTY();let x=LX+Math.cos(ang)*63,y=ty+Math.sin(ang)*63;
  let vx=Math.cos(ang)*SPD,vy=Math.sin(ang)*SPD;
  ct.setLineDash([5,8]);ct.strokeStyle='rgba(255,255,180,.45)';ct.lineWidth=1.5;
  ct.beginPath();ct.moveTo(x,y);let lx=x,ly2=y;
  for(let i=0;i<96;i++){vy+=GRAV;x+=vx;y+=vy;if(x>W+10||x<-10||y>H)break;ct.lineTo(x,y);lx=x;ly2=y;}
  ct.stroke();ct.setLineDash([]);
  ct.fillStyle='rgba(255,255,150,.68)';ct.beginPath();ct.arc(lx,Math.min(ly2,H-lava-8),5,0,Math.PI*2);ct.fill();
}

function drawBg(){
  if(activeBd==='night'){
    ct.fillStyle='#06081a';ct.fillRect(0,0,W,H);ct.fillStyle='#fff';
    [[42,30],[118,16],[198,44],[282,20],[348,36],[418,13],[62,82],[158,66],[242,88],[320,54],[400,76],[88,128],[170,112],[258,140],[338,104]].forEach(([sx,sy])=>{ct.beginPath();ct.arc(sx,sy,1.3,0,Math.PI*2);ct.fill();});
    ct.fillStyle='#fffde8';ct.beginPath();ct.arc(390,52,19,0,Math.PI*2);ct.fill();
    ct.fillStyle='#06081a';ct.beginPath();ct.arc(401,46,15,0,Math.PI*2);ct.fill();
  } else if(activeBd==='space'){
    ct.fillStyle='#000818';ct.fillRect(0,0,W,H);
    [[42,28,1],[98,18,1.5],[162,48,1],[222,14,2],[278,42,1],[342,24,1.5],[398,34,1],[452,16,2],[72,88,1],[142,78,1.5],[198,102,1],[262,68,2],[322,96,1],[382,84,1.5]].forEach(([sx,sy,sr])=>{ct.fillStyle=sr>1.2?'#ffccaa':'#aaccff';ct.beginPath();ct.arc(sx,sy,sr,0,Math.PI*2);ct.fill();});
  } else if(activeBd==='ocean'){
    const g=ct.createLinearGradient(0,0,0,H);g.addColorStop(0,'#003355');g.addColorStop(1,'#001122');
    ct.fillStyle=g;ct.fillRect(0,0,W,H);ct.strokeStyle='rgba(100,200,255,.1)';ct.lineWidth=1.5;
    [118,158,198,238].forEach((wy,i)=>{ct.beginPath();for(let x2=0;x2<=W;x2+=8)ct.lineTo(x2,wy+Math.sin(x2*.04+i*1.2)*10);ct.stroke();});
  } else {
    const g=ct.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a3a6e');g.addColorStop(1,'#5a8ec5');
    ct.fillStyle=g;ct.fillRect(0,0,W,H);ct.fillStyle='rgba(255,255,255,.82)';
    [[78,58,22],[240,40,27],[392,66,20]].forEach(([cx2,cy,r])=>{ct.beginPath();ct.arc(cx2,cy,r,0,Math.PI*2);ct.arc(cx2+r*.85,cy-r*.28,r*.7,0,Math.PI*2);ct.arc(cx2-r*.75,cy-r*.18,r*.62,0,Math.PI*2);ct.fill();});
  }
}

function drawCeiling(){
  ct.fillStyle='rgba(255,255,255,.12)';ct.fillRect(0,28,W,10);
  ct.strokeStyle='rgba(200,180,100,.4)';ct.lineWidth=1.5;
  for(let b of bells){ct.beginPath();ct.moveTo(b.bx,38);ct.lineTo(b.x,b.y);ct.stroke();}
}

function drawLava(){
  if(lava<1)return;
  const g=ct.createLinearGradient(0,H-lava,0,H);
  g.addColorStop(0,'#ff4400');g.addColorStop(.5,'#ff2200');g.addColorStop(1,'#cc0000');
  ct.fillStyle=g;ct.fillRect(0,H-lava,W,lava);
  ct.strokeStyle='#ff8800';ct.lineWidth=2;ct.beginPath();
  for(let x=0;x<=W;x+=4)ct.lineTo(x,H-lava+Math.sin((x+frame*2.5)*.07)*5);
  ct.stroke();
  if(lavaMode){ct.fillStyle=`rgba(255,80,0,${.05+Math.sin(frame*.12)*.025})`;ct.fillRect(0,0,W,H);}
}

function drawBall(){
  if(!ball)return;ct.save();ct.translate(ball.x,ball.y);
  if(activeTool==='star'){
    ct.beginPath();
    for(let i=0;i<10;i++){const r=i%2===0?13:5,a=i*Math.PI/5-Math.PI/2;i===0?ct.moveTo(r*Math.cos(a),r*Math.sin(a)):ct.lineTo(r*Math.cos(a),r*Math.sin(a));}
    ct.closePath();ct.fillStyle='#FFD700';ct.fill();ct.strokeStyle='#B8860B';ct.lineWidth=1.5;ct.stroke();
  } else if(activeTool==='diamond'){
    ct.beginPath();ct.moveTo(0,-14);ct.lineTo(11,0);ct.lineTo(0,14);ct.lineTo(-11,0);ct.closePath();
    ct.fillStyle='#88eeff';ct.fill();ct.strokeStyle='#44aacc';ct.lineWidth=1.5;ct.stroke();
  } else if(activeTool==='rocket'){
    ct.rotate(ang);ct.fillStyle='#ff6644';ct.beginPath();ct.moveTo(14,0);ct.lineTo(-7,8);ct.lineTo(-7,-8);ct.closePath();ct.fill();
    ct.fillStyle='#ffcc00';ct.beginPath();ct.arc(-7,0,7,0,Math.PI*2);ct.fill();
  } else {
    const g=ct.createRadialGradient(-3,-3,1,0,0,11);
    g.addColorStop(0,'#fffde8');g.addColorStop(.5,'#ffdd44');g.addColorStop(1,'#cc8800');
    ct.beginPath();ct.arc(0,0,11,0,Math.PI*2);ct.fillStyle=g;ct.fill();
    ct.strokeStyle='#aa6600';ct.lineWidth=1.5;ct.stroke();
  }
  ct.restore();
}

function ovl(a){ct.fillStyle=`rgba(0,0,0,${a})`;ct.fillRect(0,0,W,H);}

function roundRect(x,y,w,h,r){
  ct.beginPath();
  ct.moveTo(x+r,y);ct.lineTo(x+w-r,y);ct.quadraticCurveTo(x+w,y,x+w,y+r);
  ct.lineTo(x+w,y+h-r);ct.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ct.lineTo(x+r,y+h);ct.quadraticCurveTo(x,y+h,x,y+h-r);
  ct.lineTo(x,y+r);ct.quadraticCurveTo(x,y,x+r,y);
  ct.closePath();
}

function drawTitle(){
  ovl(.75);ct.textAlign='center';

  // Title
  ct.fillStyle='#ff6600';ct.font='bold 26px sans-serif';ct.fillText('Ring or Drown',W/2,48);
  ct.fillStyle='#ffcc00';ct.font='bold 18px sans-serif';ct.fillText('in Lava',W/2,68);
  ct.fillStyle='rgba(255,255,255,.45)';ct.font='11px sans-serif';ct.fillText('A game by Manya Bhatia',W/2,82);

  // Mode buttons
  const bY=BTN_NORMAL.y,bH=BTN_NORMAL.h;

  // Normal Mode button
  const nHov=mx>=BTN_NORMAL.x&&mx<=BTN_NORMAL.x+BTN_NORMAL.w&&my>=bY&&my<=bY+bH;
  ct.fillStyle=nHov?'rgba(50,170,70,.88)':'rgba(30,110,50,.75)';
  roundRect(BTN_NORMAL.x,bY,BTN_NORMAL.w,bH,10);ct.fill();
  ct.strokeStyle=nHov?'#66ffaa':'#44ee88';ct.lineWidth=2;ct.stroke();
  ct.fillStyle='#aaffcc';ct.font='bold 14px sans-serif';ct.fillText('NORMAL MODE',BTN_NORMAL.x+BTN_NORMAL.w/2,bY+20);
  ct.fillStyle='rgba(255,255,255,.8)';ct.font='11px sans-serif';
  ct.fillText('Bells to ring — infinite shots!',BTN_NORMAL.x+BTN_NORMAL.w/2,bY+38);
  ct.fillText('Miss 7+ times \u2192 Lava rises',BTN_NORMAL.x+BTN_NORMAL.w/2,bY+53);
  ct.fillText('Survive the rising lava!',BTN_NORMAL.x+BTN_NORMAL.w/2,bY+68);
  ct.fillStyle='#88ffbb';ct.font='bold 12px sans-serif';ct.fillText('▶ Tap to play',BTN_NORMAL.x+BTN_NORMAL.w/2,bY+85);

  // Target Mode button
  const tHov=mx>=BTN_TARGET.x&&mx<=BTN_TARGET.x+BTN_TARGET.w&&my>=bY&&my<=bY+bH;
  ct.fillStyle=tHov?'rgba(180,55,15,.88)':'rgba(120,35,8,.75)';
  roundRect(BTN_TARGET.x,bY,BTN_TARGET.w,bH,10);ct.fill();
  ct.strokeStyle=tHov?'#ff9944':'#ff6622';ct.lineWidth=2;ct.stroke();
  ct.fillStyle='#ffcc88';ct.font='bold 14px sans-serif';ct.fillText('TARGET MODE',BTN_TARGET.x+BTN_TARGET.w/2,bY+20);
  ct.fillStyle='rgba(255,255,255,.8)';ct.font='11px sans-serif';
  ct.fillText('Score 100 pts per level',BTN_TARGET.x+BTN_TARGET.w/2,bY+38);
  ct.fillText('3 levels: 50 → 40 → 30 shots',BTN_TARGET.x+BTN_TARGET.w/2,bY+53);
  ct.fillText('Miss too much → Lava rises!',BTN_TARGET.x+BTN_TARGET.w/2,bY+68);
  ct.fillStyle='#ffaa66';ct.font='bold 12px sans-serif';ct.fillText('▶ Tap to play',BTN_TARGET.x+BTN_TARGET.w/2,bY+85);

  // Rules section
  const ry=bY+bH+14;
  ct.fillStyle='rgba(255,220,80,.9)';ct.font='bold 12px sans-serif';
  ct.fillText('── HOW TO PLAY ──',W/2,ry);

  const rules=[
    ['• Drag finger to aim  /  Move mouse to aim','#fff'],
    ['• Tap (touch) or Click → SHOOT','#fff'],
    ['• Tap again while ball is flying → BOOST UP!','#fff'],
    ['• Hit bells to score  •  Red > Yellow > Green','#fff'],
    ['Miss too much \u2192 Lava Mode = game over!','#ffbb66'],
    ['[Target Mode] Score 100 pts to advance level','#ffbb66'],
  ];
  ct.font='11px sans-serif';
  rules.forEach(([txt,col],i)=>{
    ct.fillStyle=col;
    ct.fillText(txt,W/2,ry+17+i*19);
  });

  // Bottom lava
  ct.fillStyle='#ff3300';ct.fillRect(0,H-28,W,28);
  ct.strokeStyle='#ff6600';ct.lineWidth=2;ct.beginPath();
  for(let x=0;x<W;x+=4)ct.lineTo(x,H-28+Math.sin((x+frame*3)*.1)*5);ct.stroke();
}

function drawRoundClear(){
  ct.textAlign='center';const p=.65+Math.sin(celebF*.15)*.35;
  ct.globalAlpha=p;
  ct.fillStyle='#FF88FF';ct.font='bold 28px sans-serif';ct.fillText('Level Clear!',W/2,H*.35);
  ct.fillStyle='#FFDD00';ct.font='bold 20px sans-serif';ct.fillText('100 points reached!',W/2,H*.46);
  if(lv<3){ct.fillStyle='#88ffcc';ct.font='14px sans-serif';ct.fillText('Next: Level '+(lv+1)+' — '+LV_SHOTS[lv]+' shots',W/2,H*.56);}
  ct.globalAlpha=1;
}
function drawLevelStart(){
  ovl(.72);const c=LVS[Math.min(lv-1,2)];ct.textAlign='center';
  const t=Math.min(1,celebF/30);ct.globalAlpha=t;
  ct.fillStyle='#88FFFF';ct.font='bold 28px sans-serif';ct.fillText(c.name,W/2,H*.36);
  ct.fillStyle='rgba(255,255,255,.8)';ct.font='14px sans-serif';
  ct.fillText(`${c.n} bells  •  Score 100 points to advance`,W/2,H*.46);
  ct.fillStyle='#FFD700';ct.font='bold 14px sans-serif';
  ct.fillText(LV_SHOTS[lv-1]+' shots to reach the target!',W/2,H*.55);
  ct.fillStyle='rgba(255,255,255,.6)';ct.font='bold 13px sans-serif';ct.fillText('Get ready...',W/2,H*.64);
  ct.globalAlpha=1;
}
function drawGameOver(){
  const shotOut=!won&&shotsLeft<=0&&!lavaMode;
  ovl(.75);ct.textAlign='center';
  ct.fillStyle=won?'#FFD700':shotOut?'#ff8800':'#ff4400';ct.font='bold 28px sans-serif';
  ct.fillText(won?'YOU WIN!!!':shotOut?'Out of shots!':'Drowned in lava!',W/2,186);
  if(!won){ct.fillStyle='rgba(255,255,255,.7)';ct.font='14px sans-serif';ct.fillText('Level '+lv+': '+Math.min(levelScore,LV_TARGET)+'/100 points',W/2,218);}
  ct.fillStyle='#ffcc00';ct.font='20px sans-serif';ct.fillText('Total Score: '+score,W/2,244);
  ct.fillStyle='#aaffcc';ct.font='15px sans-serif';ct.fillText('Best combo: x'+maxCombo,W/2,268);
  ct.fillStyle='rgba(180,180,255,.9)';ct.font='bold 15px sans-serif';ct.fillText('Tap to choose a mode',W/2,316);
}

function render(){
  ct.save();if(shake)ct.translate(Math.sin(frame*.5)*shake*.7,0);
  drawBg();drawCeiling();
  for(let b of bells)drawBell(b);
  drawAimLine();drawTank();drawBall();drawLava();
  for(let p of parts){ct.globalAlpha=p.life/28;ct.fillStyle=p.col;ct.beginPath();ct.arc(p.x,p.y,3,0,Math.PI*2);ct.fill();}
  for(let b of booms){ct.globalAlpha=(b.life/b.ml)*.88;ct.fillStyle=b.col;ct.beginPath();ct.arc(b.x,b.y,b.r,0,Math.PI*2);ct.fill();}
  ct.globalAlpha=1;
  for(let f of floats){ct.globalAlpha=Math.min(1,f.life/28);ct.fillStyle=f.col;ct.font=(f.big?'bold 22px':'bold 15px')+' sans-serif';ct.textAlign='center';ct.fillText(f.text,f.x,f.y);}
  ct.globalAlpha=1;
  if(st==='aiming'){ct.fillStyle='rgba(255,255,200,.5)';ct.font='12px sans-serif';ct.textAlign='center';ct.fillText('Drag to aim  •  Tap/Click to shoot',W/2,getLY()-72);}
  else if(st==='flying'){ct.fillStyle='rgba(255,255,200,.65)';ct.font='bold 13px sans-serif';ct.textAlign='center';ct.fillText('Tap to BOOST UP!',W/2,getLY()-72);}
  if(st==='aiming'||st==='flying'){
    ct.fillStyle='rgba(255,100,30,0.88)';roundRect(W-78,H-54,70,42,10);ct.fill();
    ct.strokeStyle='rgba(255,200,100,0.7)';ct.lineWidth=1.5;ct.stroke();
    ct.fillStyle='#fff';ct.font='bold 14px sans-serif';ct.textAlign='center';
    ct.fillText('\uD83D\uDD25 SHOOT',W-43,H-26);
  }
  if(st==='roundclear')drawRoundClear();
  if(st==='levelstart')drawLevelStart();
  if(st==='title')drawTitle();
  if(st==='gameover')drawGameOver();
  if(mul>1){ct.globalAlpha=1;ct.fillStyle='rgba(255,100,255,.9)';ct.font='bold 12px sans-serif';ct.textAlign='left';ct.fillText('2x',6,20);}
  if(st==='aiming'||st==='flying'){
    ct.fillStyle='rgba(255,255,255,.2)';ct.font='11px sans-serif';ct.textAlign='right';
    ct.fillText('RED='+lc().pts[0]+' YEL='+lc().pts[1]+' GRN='+lc().pts[2],W-8,20);
  }
  ct.restore();
}

function loop(){requestAnimationFrame(loop);update();render();}

function resetGame(){
  score=0;coins=0;misses=0;combo=0;maxCombo=0;lava=0;lavaMode=false;shake=0;frame=0;mul=1;won=false;
  ball=null;lv=1;shotsLeft=LV_SHOTS[0];levelScore=0;celebF=0;
  owned={bd:['sky'],tool:['ball'],boost:[]};activeBd='sky';activeTool='ball';
  floats=[];parts=[];booms=[];bells=[];
  st='title';
  updHUD();
}

function gPos(e){
  const r=cv.getBoundingClientRect(),sx=W/r.width,sy=H/r.height;
  return e.touches?{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy}:{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};
}
function inShootBtn(x,y){return (st==='aiming'||st==='flying')&&x>=W-78&&x<=W-8&&y>=H-54&&y<=H-12;}

function handleActivate(){
  if(st==='title'){
    if(mx>=BTN_NORMAL.x&&mx<=BTN_NORMAL.x+BTN_NORMAL.w&&my>=BTN_NORMAL.y&&my<=BTN_NORMAL.y+BTN_NORMAL.h){
      gameMode='normal';st='aiming';initBells();return;
    }
    if(mx>=BTN_TARGET.x&&mx<=BTN_TARGET.x+BTN_TARGET.w&&my>=BTN_TARGET.y&&my<=BTN_TARGET.y+BTN_TARGET.h){
      gameMode='target';st='aiming';initBells();return;
    }
    return;
  }
  if(st==='gameover'){resetGame();return;}
  if(st==='roundclear'||st==='levelstart')return;
  if(st==='aiming'){shoot();return;}
  if(st==='flying'&&ball){ball.vy=Math.max(ball.vy-2.5,-4.6);shake=2;}
}

cv.addEventListener('mousemove',e=>{
  const p=gPos(e);mx=p.x;my=p.y;
  if(st==='aiming'&&!inShootBtn(p.x,p.y))updAng();
});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(touchOnBtn)return;
  const p=gPos(e);mx=p.x;my=p.y;
  touchDragged=true;
  if(st==='aiming')updAng();
},{passive:false});
cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  const p=gPos(e);mx=p.x;my=p.y;
  touchStartX=p.x;touchStartY=p.y;
  touchDragged=false;
  touchOnBtn=inShootBtn(p.x,p.y);
  if(st==='aiming'&&!touchOnBtn)updAng();
},{passive:false});
cv.addEventListener('touchend',e=>{
  e.preventDefault();
  if(touchOnBtn){handleActivate();touchOnBtn=false;return;}
  if(!touchDragged)handleActivate();
},{passive:false});
cv.addEventListener('click',e=>{
  const p=gPos(e);mx=p.x;my=p.y;
  handleActivate();
});

const BDS={sky:{name:'Sky',cost:0},night:{name:'Night',cost:60},space:{name:'Space',cost:200},ocean:{name:'Ocean',cost:400}};
const TOOLS={ball:{name:'Ball',cost:0},star:{name:'Star',cost:100},diamond:{name:'Diamond',cost:250},rocket:{name:'Rocket',cost:600}};
const BSTS=[{id:'2x',name:'2x Multiplier',cost:1000}];
function toggleShop(){const p=document.getElementById('shopPanel');const o=p.style.display==='block';p.style.display=o?'none':'block';if(!o)renderShop();}
function renderShop(){
  document.getElementById('shopC').textContent=coins;
  const bdR=document.getElementById('bdRow');bdR.innerHTML='';
  Object.entries(BDS).forEach(([k,v])=>{
    const own=owned.bd.includes(k),act=activeBd===k;
    const d=document.createElement('div');d.className='si'+(act?' active':own?' owned':'');
    const pc={sky:'linear-gradient(#1a3a6e,#4a7eb5)',night:'linear-gradient(#06081a,#0a1530)',space:'linear-gradient(#000818,#200030)',ocean:'linear-gradient(#003355,#001122)'};
    d.innerHTML=`<div class="sp"><div style="width:50px;height:28px;border-radius:4px;background:${pc[k]}"></div></div><div class="sn">${v.name}</div><div class="sc">${(own||act)?'Owned':v.cost+' coins'}</div>`;
    d.onclick=()=>bAct('bd',k,v.cost);bdR.appendChild(d);
  });
  const tR=document.getElementById('tRow');tR.innerHTML='';
  const tp={ball:'<div style="width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffde8,#ffdd44,#cc8800)"></div>',star:'⭐',diamond:'<div style="width:16px;height:16px;background:#88eeff;transform:rotate(45deg);border:2px solid #44aacc"></div>',rocket:'🚀'};
  Object.entries(TOOLS).forEach(([k,v])=>{
    const own=owned.tool.includes(k),act=activeTool===k;
    const d=document.createElement('div');d.className='si'+(act?' active':own?' owned':'');
    d.innerHTML=`<div class="sp">${tp[k]}</div><div class="sn">${v.name}</div><div class="sc">${(own||act)?'Owned':v.cost+' coins'}</div>`;
    d.onclick=()=>bAct('tool',k,v.cost);tR.appendChild(d);
  });
  const bR=document.getElementById('bRow');bR.innerHTML='';
  BSTS.forEach(b=>{
    const own=owned.boost.includes(b.id);
    const d=document.createElement('div');d.className='si'+(own?' owned':'');
    d.innerHTML=`<div class="sp" style="font-size:18px">x2</div><div class="sn">${b.name}</div><div class="sc">${own?'Active!':b.cost+' coins'}</div>`;
    d.onclick=()=>bBoost(b);bR.appendChild(d);
  });
}
function bAct(type,key,cost){
  if(owned[type].includes(key)){if(type==='bd')activeBd=key;else activeTool=key;renderShop();return;}
  if(coins<cost){floats.push({x:W/2,y:H*.5,text:'Not enough coins!',life:55,col:'#ff4444'});return;}
  coins-=cost;owned[type].push(key);if(type==='bd')activeBd=key;else activeTool=key;renderShop();
}
function bBoost(b){
  if(owned.boost.includes(b.id))return;
  if(coins<b.cost){floats.push({x:W/2,y:H*.5,text:'Not enough coins!',life:55,col:'#ff4444'});return;}
  coins-=b.cost;owned.boost.push(b.id);mul=2;
  floats.push({x:W/2,y:H*.38,text:'2x ACTIVE!',life:80,col:'#ff88ff',big:true});renderShop();
}

loop();
</script>
</body>
</html>
